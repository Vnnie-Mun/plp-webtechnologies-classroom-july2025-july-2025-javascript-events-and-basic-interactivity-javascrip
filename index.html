<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Web Page with JavaScript</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🚀 Interactive Web Page</h1>
    <button id="themeToggle">🌙 Toggle Dark Mode</button>
  </header>

  <main>
    <!-- Part 1: Event Handling Example -->
    <section>
      <h2>🎮 Counter Game</h2>
      <button id="incrementBtn">Click Me!</button>
      <p>Score: <span id="counter">0</span></p>
    </section>

    <!-- Part 2: Interactive Elements -->
    <section>
      <h2>📖 FAQ Section</h2>
      <div class="faq">
        <h3 class="faq-question">What is JavaScript?</h3>
        <p class="faq-answer hidden">JavaScript is a programming language used to make web pages interactive.</p>
      </div>
      <div class="faq">
        <h3 class="faq-question">What is DOM?</h3>
        <p class="faq-answer hidden">DOM (Document Object Model) represents the structure of a webpage.</p>
      </div>
    </section>

    <!-- Part 3: Form Validation -->
    <section>
      <h2>📋 Registration Form</h2>
      <form id="registerForm" novalidate>
        <label>
          Name:
          <input type="text" id="name" />
          <span class="error" id="nameError"></span>
        </label>
        <br />

        <label>
          Email:
          <input type="email" id="email" />
          <span class="error" id="emailError"></span>
        </label>
        <br />

        <label>
          Password:
          <input type="password" id="password" />
          <span class="error" id="passwordError"></span>
        </label>
        <br />

        <button type="submit">Register</button>
      </form>
      <p id="formSuccess" class="success"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
